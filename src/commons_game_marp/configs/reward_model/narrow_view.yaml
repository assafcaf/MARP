defaults:
  - base_reward_model

enabled: true
mode: narrow_view
phi: efficiency_x_peace
lr: 0.0001
batch_pairs: 64
train_steps_per_update: 50
# Null trains at every episode end, matching the policies' cadence.
update_every_env_steps: null
warmup_episodes: 50
max_episodes_in_buffer: 5000
device: auto
save_every_episodes: 200
