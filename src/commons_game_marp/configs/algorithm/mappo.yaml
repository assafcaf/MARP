defaults:
  - base_mappo

name: mappo
learning_rate: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef_mode: adaptive
ent_coef: 0.1
ent_coef_end: 0.01
target_entropy_frac: 0.6
ent_coef_lr: 0.003
ent_coef_min: 0.001
ent_coef_max: 0.5
vf_coef: 0.5
# Null aligns the update with the episode boundary: one update per
# episode per environment, over ep_length * num_envs transitions.
n_steps: null
batch_size: 256
update_epochs: 4
hidden_size: 256
max_grad_norm: 0.5
normalize_obs: true
flatten_obs: false
device: auto
