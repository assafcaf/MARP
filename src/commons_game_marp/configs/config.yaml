# Composition root. Override any group from the CLI:
#   uv run commons-game-train algorithm=ippo env=medium reward_model=off
defaults:
  - base_config
  - env: medium
  - algorithm: mappo
  - reward_model: "off"
  - logging: default
  - _self_

episodes: 100
seed: 0

hydra:
  # Keep the process CWD at the repo root so `logging.log_dir: logs` and the
  # plotting scripts resolve the same paths they always have.
  job:
    chdir: false
  # One directory per run, holding Hydra's `.hydra/` snapshot and job log next
  # to the training artifacts, grouped by configuration:
  #   logs/<algorithm>-map=..-agents=..-rm=../<timestamp>-seed=N/
  # `commons.run_path` builds that path from the composed config; see
  # train/run_paths.py. Single runs and sweep jobs share the layout, so a sweep
  # over seeds fills one configuration directory with sibling runs.
  run:
    dir: ${logging.log_dir}/${commons.run_path:}
  sweep:
    dir: ${logging.log_dir}
    subdir: ${commons.run_path:}
