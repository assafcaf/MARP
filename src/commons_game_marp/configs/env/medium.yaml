defaults:
  - base_env

map_type: medium
num_agents: 5
agent_view_range: 7
num_frames: 1
ep_length: 600
render: false
spawn_speed: slow
metric: Efficiency
penalty: false

# Worker processes the environment copies are spread across. 0 steps them
# in-process. Results are bit-identical either way; see docs/metrics.md.
num_workers: 0
include_state_in_info: false
